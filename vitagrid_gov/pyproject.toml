[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vitagrid-gov"
version = "4.2.1"
description = "VitaGrid GOV - Sovereign Multi-Agent Health Logistics API Gateway"
authors = [{ name = "VitaGrid GOV Sovereign Engineering" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "websockets>=12.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.4",
    "httpx>=0.27.0",
    "cryptography>=42.0.5",
    "pyjwt>=2.8.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.2.0",
    "peft>=0.10.0",
    "transformers>=4.40.0",
    "xgboost>=2.0.3",
    "shap>=0.45.1",
    "scikit-learn>=1.4.2",
    "scipy>=1.13.0",
    "pulp>=2.8.0",
    "numpy>=1.26.4",
]

[tool.hatch.build.targets.wheel]
packages = ["db", "api", "rag", "core", "agents", "models", "realtime"]

